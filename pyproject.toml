[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinntorch"
version = "0.1.0"
description = "Physics-Informed Neural Networks for PyTorch. Solve PDEs with deep learning."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Kasra Kakavand", email = "kasrakakavand@gmail.com"}
]
keywords = [
    "physics-informed-neural-networks",
    "pinn",
    "pytorch",
    "deep-learning",
    "partial-differential-equations",
    "scientific-computing",
    "machine-learning",
    "sciml",
    "neural-pde",
    "scientific-machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=1.0.0",
]

all = [
    "pinntorch[viz,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/kasra-kakavand/pinntorch"
Documentation = "https://github.com/kasra-kakavand/pinntorch#readme"
Repository = "https://github.com/kasra-kakavand/pinntorch"
Issues = "https://github.com/kasra-kakavand/pinntorch/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinntorch*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
